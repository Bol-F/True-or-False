services:
  - type: web
    name: rufact-ml-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./ml/Dockerfile
    dockerContext: ./ml
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ML_API_JWT_SECRET
        sync: false
      - key: RUFACT_ENV
        value: production
      - key: RUFACT_ALLOWED_HOSTS
        fromService:
          type: web
          name: rufact-ml-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: RUFACT_API_DOCS_ENABLED
        value: "false"
      - key: RUFACT_MAX_CONCURRENT_PREDICTIONS
        value: "2"
      - key: RUFACT_PREDICTION_QUEUE_TIMEOUT_MS
        value: "500"
      - key: RUFACT_UVICORN_LIMIT_CONCURRENCY
        value: "16"
      - key: RUFACT_UVICORN_BACKLOG
        value: "64"
